background: "#E3F0FF"
configurate_methods:
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
    provider_source: provider/ngs_llm.py
help:
  title:
    en_US: Get your API key from Azure
    zh_Hans: 从 Azure 获取 API Key
  url:
    en_US: https://azure.microsoft.com/en-us/products/ai-services/openai-service
icon_large:
  en_US: icon_l_en.png
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Ngs LLM Service Model
model_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Endpoint URL
        zh_Hans: API 域名
      placeholder:
        en_US: "Enter your API Endpoint, eg: https://example.com/xxx"
        zh_Hans: 在此输入您的 API 域名，如：https://example.com/xxx
      required: true
      type: text-input
      variable: openai_api_base
    - label:
        en_US: API Key
        zh_Hans: API Key
      placeholder:
        en_US: Enter your API key here
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      variable: openai_api_key
    - label:
        en_US: API Version
        zh_Hans: API 版本
      options:
        - label:
            en_US: 2025-03-01-preview
          value: 2025-03-01-preview
        - label:
            en_US: 2025-02-01-preview
          value: 2025-02-01-preview
        - label:
            en_US: 2025-01-01-preview
          value: 2025-01-01-preview
        - label:
            en_US: 2024-12-01-preview
          value: 2024-12-01-preview
        - label:
            en_US: 2024-10-01-preview
          value: 2024-10-01-preview
        - label:
            en_US: 2024-09-01-preview
          value: 2024-09-01-preview
        - label:
            en_US: 2024-08-01-preview
          value: 2024-08-01-preview
        - label:
            en_US: 2024-07-01-preview
          value: 2024-07-01-preview
        - label:
            en_US: 2024-05-01-preview
          value: 2024-05-01-preview
        - label:
            en_US: 2024-04-01-preview
          value: 2024-04-01-preview
        - label:
            en_US: 2024-03-01-preview
          value: 2024-03-01-preview
        - label:
            en_US: 2024-02-15-preview
          value: 2024-02-15-preview
        - label:
            en_US: 2023-12-01-preview
          value: 2023-12-01-preview
        - label:
            en_US: "2024-02-01"
          value: "2024-02-01"
        - label:
            en_US: "2024-06-01"
          value: "2024-06-01"
      placeholder:
        en_US: Select your API Version here
        zh_Hans: 在此选择您的 API 版本
      required: true
      type: select
      variable: openai_api_version
    - label:
        en_US: Base Model
        zh_Hans: 基础模型
      options:
        - label:
            en_US: openaio1-mini
          show_on:
            - value: llm
              variable: __model_type
          value: openaio1-mini
        - label:
            en_US: openaio1
          show_on:
            - value: llm
              variable: __model_type
          value: openaio1
        - label:
            en_US: openai4o
          show_on:
            - value: llm
              variable: __model_type
          value: openai4o
        - label:
            en_US: openai4-turbo
          show_on:
            - value: llm
              variable: __model_type
          value: openai4-turbo
        - label:
            en_US: Gemini 1.5 Pro
          show_on:
            - value: llm
              variable: __model_type
          value: gemini-1.5-pro
        - label:
            en_US: Nec llm
          show_on:
            - value: llm
              variable: __model_type
          value: nec-llm
        - label:
            en_US: Cotomi pro
          show_on:
            - value: llm
              variable: __model_type
          value: cotomi-pro
        - label:
            en_US: Claude v3Haiku
          show_on:
            - value: llm
              variable: __model_type
          value: claude-v3haiku
        - label:
            en_US: Claude v3.5Sonnet
          show_on:
            - value: llm
              variable: __model_type
          value: claude-v3.5sonnet
        - label:
            en_US: Gemini 2.0 Flash
          show_on:
            - value: llm
              variable: __model_type
          value: gemini-2.0-flash
        - label:
            en_US: text-embedding-ada-002
          show_on:
            - value: text-embedding
              variable: __model_type
          value: text-embedding-ada-002
        - label:
            en_US: text-embedding-3-small
          show_on:
            - value: text-embedding
              variable: __model_type
          value: text-embedding-3-small
        - label:
            en_US: text-embedding-3-large
          show_on:
            - value: text-embedding
              variable: __model_type
          value: text-embedding-3-large
      placeholder:
        en_US: Enter your model version
        zh_Hans: 在此输入您的模型版本
      required: true
      type: select
      variable: base_model_name
  model:
    label:
      en_US: Deployment Name
      zh_Hans: 部署名称
    placeholder:
      en_US: Enter your Deployment Name here, matching the Azure deployment name.
      zh_Hans: 在此输入您的部署名称，与 Azure 部署名称匹配。
models:
  llm:
    predefined:
      - models/llm/*.yaml
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml
provider: ngs_llm
supported_model_types:
  - llm
  - text-embedding
